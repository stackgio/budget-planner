<style>
/* Layout: one mobile column (max 600px) of cards, sticky top bar, fixed bottom tab bar, bottom sheets for every form.
   Dark-first by request; light is an in-app choice (data-app-theme), or follows the device under "system". */
:root {
  color-scheme: dark;
  --bg: #0c100f; --surface: #131917; --surface-2: #1a211f; --surface-3: #222b28; --line: #29332f; --line-2: #34403b;
  --text: #ecf2ef; --text-2: #a9b6b1; --muted: #7a8883;
  --accent: #3fd68f; --accent-2: #2fb877; --accent-ink: #03150c; --accent-soft: rgba(63, 214, 143, .13);
  --reserve: #8fe3bb; --unassigned: #5d6b66;
  --uncle: #a4adff; --uncle-ink: #0b0d24; --uncle-soft: rgba(164, 173, 255, .12);
  --warn: #f3b648; --warn-soft: rgba(243, 182, 72, .12); --bad: #f2706a; --bad-soft: rgba(242, 112, 106, .12);
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --cat-0: #7d8783; --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #33a133; --cat-7: #9085e9; --cat-8: #e66767;
  --font-ui: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-num: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px; --r-sm: 12px;
}
:root[data-app-theme="light"] {
  color-scheme: light;
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #f3f6f4; --surface-3: #e7ece9; --line: #dbe3df; --line-2: #c9d3ce;
  --text: #0f1714; --text-2: #46534e; --muted: #67756f;
  --accent: #0e9a5f; --accent-2: #0b8250; --accent-ink: #ffffff; --accent-soft: rgba(14, 154, 95, .1);
  --reserve: #6cc79c; --unassigned: #b5c0bb;
  --uncle: #4c58cf; --uncle-ink: #ffffff; --uncle-soft: rgba(76, 88, 207, .09);
  --warn: #9a6a00; --warn-soft: rgba(201, 133, 0, .12); --bad: #c63d37; --bad-soft: rgba(198, 61, 55, .09);
  --shadow: 0 10px 30px rgba(20, 40, 30, .12);
  --cat-0: #8a948f; --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #6250d6; --cat-8: #e34948;
}
@media (prefers-color-scheme: light) {
  :root[data-app-theme="system"] {
    color-scheme: light;
    --bg: #eef2f0; --surface: #ffffff; --surface-2: #f3f6f4; --surface-3: #e7ece9; --line: #dbe3df; --line-2: #c9d3ce;
    --text: #0f1714; --text-2: #46534e; --muted: #67756f;
    --accent: #0e9a5f; --accent-2: #0b8250; --accent-ink: #ffffff; --accent-soft: rgba(14, 154, 95, .1);
    --reserve: #6cc79c; --unassigned: #b5c0bb;
    --uncle: #4c58cf; --uncle-ink: #ffffff; --uncle-soft: rgba(76, 88, 207, .09);
    --warn: #9a6a00; --warn-soft: rgba(201, 133, 0, .12); --bad: #c63d37; --bad-soft: rgba(198, 61, 55, .09);
    --shadow: 0 10px 30px rgba(20, 40, 30, .12);
    --cat-0: #8a948f; --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #6250d6; --cat-8: #e34948;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.money { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
.muted { color: var(--text-2); } .small { font-size: 13px; } .tiny { font-size: 12px; } .center { text-align: center; justify-content: center; }
.grow { flex: 1 1 auto; } .minw { min-width: 0; } .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; } .row.gap { gap: 10px; } .row.between { justify-content: space-between; gap: 10px; } .row.gap > * { flex: 1 1 0; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.neg, .negv { color: var(--bad); } .pos { color: var(--accent); } .strike { text-decoration: line-through; color: var(--muted); }
.uncle-ink { color: var(--uncle); } .warn-ink { color: var(--warn); }

.app { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding-block: 12px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); flex: none; }
.brand-t { font-weight: 700; font-size: 16px; line-height: 1.15; letter-spacing: -.015em; }
.save-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); flex: none; }
.save-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.save-pill.good i { background: var(--accent); } .save-pill.warn i { background: var(--warn); } .save-pill.bad i { background: var(--bad); }
.save-pill.warn { color: var(--warn); } .save-pill.bad { color: var(--bad); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 32px; height: 32px; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); margin-bottom: 12px; font-size: 13px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner b { color: var(--text); }
.main { display: block; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 4px; }
.section-t { margin: 20px 0 10px; }

.hero { padding: 20px 18px 16px; background: radial-gradient(120% 90% at 100% 0%, var(--accent-soft), transparent 60%), var(--surface); }
.hero-num { font-family: var(--font-num); font-size: clamp(34px, 11vw, 46px); font-weight: 600; letter-spacing: -.045em; line-height: 1.1; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
.hero-split { display: grid; gap: 2px; border-radius: var(--r-sm); overflow: hidden; }
.hs { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface-2); text-align: left; min-height: 48px; }
.hs:hover { background: var(--surface-3); }
.hs-l { flex: 1 1 auto; color: var(--text-2); font-size: 14px; } .hs-v { font-size: 16px; font-weight: 600; }
.hero-foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.hero-foot b { color: var(--text); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; margin-right: 6px; vertical-align: 1px; }
.dot.paid { background: var(--accent); } .dot.res { background: var(--reserve); box-shadow: inset 0 0 0 2px var(--accent-2); background: transparent; } .dot.un { background: var(--unassigned); }

.uncle-strip { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: linear-gradient(90deg, var(--uncle-soft), transparent 70%), var(--surface); color: var(--text); }
.us-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--uncle-soft); color: var(--uncle); flex: none; }
.us-v { font-size: 20px; font-weight: 600; color: var(--uncle); }
.us-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.us-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.quick-row { display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 600; font-size: 15px; background: var(--surface-2); border: 1px solid var(--line); transition: transform .12s ease, background .15s ease; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); }
.btn.uncle { background: var(--uncle); color: var(--uncle-ink); border-color: transparent; }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.block { width: 100%; } .btn.sm { white-space: nowrap;  min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.danger-ink { color: var(--bad) !important; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 14px; }
.link.center { align-self: center; color: var(--text-2); padding: 8px; }
.chip-btn { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
.chip-btn:hover { border-color: var(--line-2); } .chip-btn.warn { color: var(--warn); }

.seg { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; min-height: 40px; padding: 0 12px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--line-2), 0 2px 8px rgba(0,0,0,.18); }
.seg.small button { min-height: 36px; font-size: 13px; padding: 0 10px; }
.seg-n { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.seg button.on .seg-n { color: var(--accent); }
.period { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.custom-range .field { margin: 0; }

.kv-list { display: flex; flex-direction: column; }
.kv { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.kv:first-child { border-top: 0; padding-top: 2px; }
.kv-k { font-size: 14px; } .kv-note { font-size: 12px; color: var(--muted); }
.kv-v { font-size: 15px; font-weight: 500; text-align: right; }
.kv.strong .kv-k { font-weight: 650; } .kv.strong .kv-v { font-weight: 650; color: var(--accent); }
.kv.uncle-kv .kv-v { color: var(--uncle); }
.kv-sep { height: 6px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 14px; height: 10px; border-radius: 3px; }
.lg.solid { background: var(--text-2); } .lg.hatch { background: repeating-linear-gradient(135deg, var(--text-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--text-2); }
.lg.moved { background: var(--unassigned); } .lg.spent { background: var(--accent); }
.catbars { display: flex; flex-direction: column; gap: 12px; }
.cb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 5px; }
.cb-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.cb-track { display: flex; gap: 2px; height: 10px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.cb-paid { display: block; height: 100%; border-radius: 4px; }
.cb-res { display: block; height: 100%; border-radius: 4px; background: repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px currentColor; }
.cb-sub { margin-top: 3px; }

/* bills */
.bills { display: flex; flex-direction: column; }
.bill { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 56px; border-top: 1px solid var(--line); }
.card > .bill:first-of-type, .bills > .bill:first-child, .bills > .bill-wrap:first-child > .bill { border-top: 0; }
.check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; color: var(--accent-ink); transition: background .15s, border-color .15s, transform .12s; }
.check:hover:not(:disabled) { border-color: var(--accent); }
.check:active:not(:disabled) { transform: scale(.9); }
.check.paid { background: var(--accent); border-color: var(--accent); }
.check.partial { border-color: var(--accent); }
.check .half { width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--accent); }
.check.canceled { border-style: dashed; }
.bill-main { flex: 1 1 auto; min-width: 0; text-align: left; padding: 4px 0; }
.bill-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bill.paid .bill-name { color: var(--text-2); }
.bill.canceled .bill-name { color: var(--muted); text-decoration: line-through; }
.bill-meta { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 12px; color: var(--muted); margin-left: 18px; }
.bill-meta .overdue { color: var(--bad); font-weight: 600; }
.bill-amt { font-size: 15px; font-weight: 500; }
.bill.paid .bill-amt { color: var(--text-2); }
.bill-wrap { border-top: 1px solid var(--line); }
.bill-wrap:first-child { border-top: 0; }
.bill-wrap .bill { border-top: 0; }
.more-toggle { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0 0 8px 42px; }
.bill-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 12px 42px; }
.bill-actions .full { flex-basis: 100%; }

.tcard { padding: 14px 16px 10px; }
.tcard.completed, .tcard.archived { opacity: .92; }
.tc-head { display: flex; gap: 10px; width: 100%; text-align: left; }
.tc-meta { font-size: 12px; color: var(--muted); }
.tc-amt { font-size: 26px; font-weight: 600; letter-spacing: -.03em; margin: 2px 0; }
.tc-note { font-size: 13px; color: var(--text-2); }
.tc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.tc-pct { font-size: 20px; font-weight: 600; color: var(--accent); }
.pbar { display: flex; gap: 2px; height: 10px; margin: 12px 0 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.pbar span { display: block; height: 100%; border-radius: 4px; transition: width .35s ease; }
.pb-paid { background: var(--accent); }
.pb-res { background: repeating-linear-gradient(135deg, var(--accent-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px var(--accent-2); }
.pb-un { background: var(--unassigned); }
.tc-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.tc-stats .money { color: var(--text); margin-right: 3px; }
.pad-x { padding: 6px 0; }
.assign-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 44px; margin: 6px 0 4px; border: 1.5px dashed var(--line-2); border-radius: 12px; color: var(--accent); font-weight: 600; font-size: 14px; }
.note-bar { margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.warn-bar { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }

.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--accent); color: var(--accent-ink); }
.pill.neutral { background: var(--surface-3); color: var(--text-2); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.uncle { background: var(--uncle-soft); color: var(--uncle); }

.empty { text-align: center; padding: 30px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); margin-bottom: 4px; }
.empty p { max-width: 34ch; font-size: 14px; }
.empty .btn { margin-top: 8px; }

/* history */
.ev-list { display: flex; flex-direction: column; }
.evrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-top: 1px solid var(--line); min-height: 56px; }
.evrow:first-child { border-top: 0; }
.ev-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.ev-ic.payment { background: var(--accent-soft); color: var(--accent); }
.ev-ic.u { background: var(--uncle-soft); color: var(--uncle); }
.ev-t { font-weight: 600; font-size: 14px; }
.ev-amt { font-size: 14px; font-weight: 500; color: var(--text-2); }
.ev-amt.spent { color: var(--text); } .ev-amt.u { color: var(--uncle); }
.search { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; min-height: 48px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); }
.search input { flex: 1 1 auto; min-width: 0; border: 0; background: none; outline: none; min-height: 46px; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--text-2); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tl-group { padding-block: 12px 4px; }

.picture { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pic { border-radius: var(--r); padding: 14px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pic-k { font-size: 12px; font-weight: 600; color: var(--text-2); }
.pic-v { font-size: 20px; font-weight: 600; }
.pic-n { font-size: 12px; color: var(--muted); }
.pic.moved .pic-v { color: var(--text-2); }
.pic.reserved .pic-v { color: var(--reserve); }
.pic.spent { background: var(--accent-soft); border-color: transparent; } .pic.spent .pic-v { color: var(--accent); }
.pic.uncle { background: var(--uncle-soft); border-color: transparent; } .pic.uncle .pic-v { color: var(--uncle); }
@media (max-width: 360px) { .picture { grid-template-columns: 1fr; } }
.chart { margin-bottom: 8px; }
.readout { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; color: var(--text-2); margin-bottom: 6px; min-height: 20px; }
