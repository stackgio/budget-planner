<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>First $100K Timeline</title>
<style>
  :root {
    --bg: #F5F3EC; --ink: #13171E; --ink2: #4A5260; --muted: #7C838E;
    --green: #13865B; --gdark: #0A6343; --gsoft: #DCEFE4;
    --line: #E3DFD4; --amber: #F4E8C8; --amberline: #C9A44A; --amberink: #5A4310;
  }
  html, body { margin: 0; background: var(--bg); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Inter", sans-serif; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .a { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 0 0; }
  .mask { overflow: hidden; }
  .mask > .in { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .g { color: var(--green); }
  .gd { color: var(--gdark); }
  .card { border-radius: 24px; background: #fff; overflow: hidden; box-sizing: border-box; }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--green); }
  .lbl { font-size: 22px; line-height: 26px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
  .amt { font-size: 60px; line-height: 76px; font-weight: 800; letter-spacing: -.01em; }
  .unit { font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: .06em; }
  .track { height: 24px; border-radius: 12px; background: #ECE9E1; }
  .bar { height: 24px; border-radius: 12px; background: var(--green); }
  .grid { width: 2px; height: 40px; background: rgba(19,23,30,.13); }
  .shade { height: 24px; border-radius: 0 12px 12px 0;
    background: repeating-linear-gradient(135deg, rgba(19,134,91,.26) 0 6px, rgba(19,134,91,.08) 6px 12px); }
  .ref { width: 0; height: 44px; border-left: 3px dashed rgba(10,99,67,.6); }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--gdark);
    box-shadow: 0 0 0 4px #fff, 0 2px 6px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  .cap { font-size: 50px; line-height: 72px; font-weight: 800; text-align: center; width: 936px; white-space: normal; letter-spacing: -.005em; }
  .cap .pill { background: #16181C; color: #fff; padding: 6px 22px; border-radius: 16px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cap .g { color: #5BE3A4; }
  .tick { font-size: 30px; line-height: 36px; font-weight: 700; color: var(--ink2); }
  .foot { font-size: 28px; line-height: 36px; font-weight: 600; color: var(--ink2); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="warp.js"></script>
<script>
// ---------- data (from model.py; bar lengths use exact months / 12) ----------
// $100 307 mo = 25.58 y · $250 196 mo = 16.33 y · $500 128 mo = 10.67 y · $1,000 77 mo = 6.42 y
const ROWS = [
  { amt: "$100",   dur: "26", months: 307, tIn: 9.15,  bar: [9.75, 11.05],  tDur: 11.13 },
  { amt: "$250",   dur: "16", months: 196, tIn: 12.39, bar: [12.75, 13.75], tDur: 13.80 },
  { amt: "$500",   dur: "11", months: 128, tIn: 15.09, bar: [15.35, 16.33], tDur: 16.38 },
  { amt: "$1,000", dur: "6½", months: 77,  tIn: 17.65, bar: [17.95, 18.80], tDur: 18.85 },
];
// All times below are in ORIGINAL voiceover seconds. The rendered video uses the tightened
// voiceover (tighten.py); toOld() maps video time back, so reveals stay on their words.
const DURATION_OLD = 28.8;   // VO ends 27.48; the four choices + question hold to 28.8
const WARP = window.WARP || { keep: 0.28, pauses: [] };
function toOld(tn) {
  let shift = 0;
  for (const [s, e] of WARP.pauses) {
    const d = e - s, nd = Math.min(d, WARP.keep), sN = s - shift;
    if (tn < sN) return tn + shift;
    if (tn < sN + nd) return s + (tn - sN) * d / nd;   // a shortened pause plays slightly faster
    shift += d - nd;
  }
  return tn + shift;
}
const DURATION = DURATION_OLD - WARP.pauses.reduce((a, [s, e]) => a + Math.max(0, e - s - WARP.keep), 0);

// ---------- layout ----------
const CX = 72, CW = 866, ROW_Y0 = 420, ROW_H = 140, ROW_GAP = 14;
const PAD = 28, TRACK_W = 810, PX = TRACK_W / 30;      // 27 px per year, shared by hook and chart
const X0 = CX + PAD;                                    // year 0 in stage px
const BAR_Y = 98;                                       // bar top inside card
const rowY = i => ROW_Y0 + i * (ROW_H + ROW_GAP);
// hook: two towers on a shared baseline, height = exact years (the $100 and $1,000 rows)
const HB = 1220, PXV = 15, TOWER_W = 150, HOOK_X = [290, 790];
// ending: the four rows become a 2×2 grid of choices
const CHIP_W = 420, CHIP_H = 232;
const chip = i => ({ x: i % 2 ? 518 : 72, y: 790 + (i > 1 ? CHIP_H + 22 : 0), w: CHIP_W, h: CHIP_H });

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const L = (a, b, p) => a + (b - a) * p;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c1, c2, p) => { const a = hex(c1), b = hex(c2);
  return `rgb(${a.map((v, i) => Math.round(L(v, b[i], p))).join(",")})`; };
const mixH = (c1, c2, p) => { const a = hex(c1), b = hex(c2);
  return "#" + a.map((v, i) => Math.round(L(v, b[i], p)).toString(16).padStart(2, "0")).join(""); };
// keyframes [[t,v],...] with eased interpolation
const kf = (t, k) => { if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0])
    return L(k[i - 1][1], k[i][1], eio(P(t, k[i - 1][0], k[i][0])));
  return k[k.length - 1][1]; };
const bump = (t, a, b) => Math.sin(Math.PI * P(t, a, b));
// baseline offset from line-box top for Inter
const BL = (size, lh) => (lh - 1.2109 * size) / 2 + 0.96875 * size;

const stage = document.getElementById("stage");
function el(cls, html = "", parent = stage) {
  const d = document.createElement("div"); d.className = cls; d.innerHTML = html; parent.appendChild(d); return d;
}
function maskEl(cls, html, h, parent = stage) {
  const m = el("a mask " + cls, "", parent); m.style.height = h + "px";
  const i = el("in", html, m); return { m, i };
}
function S(e, o) { for (const k in o) e.style[k] = o[k]; }
function pos(e, x, y, s = 1, op = 1) {
  e.style.transform = `translate(${x}px,${y}px) scale(${s})`; e.style.opacity = op;
}
function rise(i, p, out = 0) { i.style.transform = `translateY(${(1 - p) * 105 - out * 105}%)`; }
const meas = el("a", ""); meas.style.visibility = "hidden";
function tw(html, cls, css = "") {
  meas.className = "a " + cls; meas.style.cssText = "visibility:hidden;" + css; meas.innerHTML = html;
  return meas.getBoundingClientRect().width;
}

const CHECK = `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.5 8.4l2.9 2.9 6-6.3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const G = s => `<span class="g">${s}</span>`;

// a duration readout "≈ 26 YEARS" built from absolutely positioned parts (size = number font px)
function makeDur(parent, num, size, unitSize, ph = true) {
  const d = { g: el("a", "", parent), size, unitSize, lh: Math.round(size * 1.25) };
  const css = `font-size:${size}px;line-height:${d.lh}px;font-weight:900;letter-spacing:-.01em`;
  d.apx = el("a", "≈", d.g); d.apx.style.cssText += ";" + css;
  d.m = el("a mask", "", d.g); d.m.style.height = d.lh + "px";
  d.ph = el("in", ph ? "?" : "", d.m); d.ph.style.cssText += ";" + css + ";color:#A0A6AE";
  d.v = el("in", num, d.m); d.v.style.cssText += ";" + css;
  d.u = el("a", "YEARS", d.g);
  d.u.style.cssText += `;font-size:${unitSize}px;line-height:${unitSize + 6}px;font-weight:800;letter-spacing:.06em`;
  d.wA = tw("≈", "", css); d.wPh = ph ? tw("?", "", css) : 0; d.wN = tw(num, "", css);
  d.wU = tw("YEARS", "", `font-size:${unitSize}px;font-weight:800;letter-spacing:.06em`);
  d.uTop = BL(size, d.lh) - BL(unitSize, unitSize + 6);
  return d;
}
// lays the readout out for reveal progress p; returns its width
function layDur(d, p, col, ucol) {
  const mw = L(d.wPh, d.wN, p), ux = d.wA + 4 + mw + 10;
  S(d.m, { width: mw + "px", transform: `translateX(${d.wA + 4}px)` });
  rise(d.v, p); rise(d.ph, 1, p);
  pos(d.apx, 0, 0); pos(d.u, ux, d.uTop);
  d.v.style.color = col; d.apx.style.color = col; d.u.style.color = ucol;
  return ux + d.wU;
}

// ---------- build ----------
let E = {};
function build() {
  E.wm = el("a", "@stackwithgio");
  S(E.wm, { fontSize: "26px", fontWeight: 700, color: "rgba(19,23,30,.45)", letterSpacing: ".02em" });

  // ---- hook ----
  E.yf = el("a", "YOUR FIRST");
  S(E.yf, { fontSize: "54px", lineHeight: "64px", fontWeight: 800, letterSpacing: ".1em" });
  E.ct = el("a", "COULD TAKE");
  S(E.ct, { fontSize: "42px", lineHeight: "52px", fontWeight: 800, letterSpacing: ".1em", color: "var(--ink2)" });
  E.or = el("a", "or");
  S(E.or, { fontSize: "44px", lineHeight: "52px", fontWeight: 800, color: "var(--muted)" });
  E.base = el("a"); S(E.base, { width: CW + "px", height: "4px", borderRadius: "2px", background: "#16181C" });
  E.hook = [0, 3].map((ri, k) => {
    const r = ROWS[ri], col = k ? "var(--green)" : "#16181C", o = { r, k, x: HOOK_X[k] };
    o.tower = el("a"); S(o.tower, { width: TOWER_W + "px", borderRadius: "18px 18px 4px 4px", background: col });
    o.num = el("a", `<span style="font-size:96px">≈</span>${r.dur}`);
    S(o.num, { fontFamily: "'Inter Display', Inter, sans-serif", fontSize: "168px", lineHeight: "168px", fontWeight: 900,
      letterSpacing: "-.03em", color: col });
    o.yrs = el("a", "YEARS"); S(o.yrs, { fontSize: "42px", lineHeight: "48px", fontWeight: 900, letterSpacing: ".14em", color: col });
    o.lab = el("a", `${r.amt}<span style="font-size:32px;font-weight:700;color:var(--ink2)">/mo</span>`);
    S(o.lab, { fontSize: "52px", lineHeight: "62px", fontWeight: 800 });
    o.wNum = o.num.getBoundingClientRect().width; o.wYrs = o.yrs.getBoundingClientRect().width;
    o.wLab = o.lab.getBoundingClientRect().width;
    return o;
  });
  // slow push-in on the comparison while the narration finishes the hook
  E.hookC = el("a"); E.hookC.style.transformOrigin = "540px 900px";
  E.hook.forEach(o => [o.tower, o.num, o.yrs].forEach(n => E.hookC.appendChild(n)));
  [E.or, E.base].forEach(n => E.hookC.appendChild(n));

  // ---- goal badge (the hook's $100,000 flies into it) ----
  E.badge = el("a"); S(E.badge, { height: "76px", borderRadius: "38px", background: "var(--green)" });
  E.bdot = el("a dot", CHECK); E.bdot.style.boxShadow = "0 0 0 4px rgba(255,255,255,.9)";
  E.goal = el("a", "GOAL");
  S(E.goal, { fontSize: "22px", lineHeight: "26px", fontWeight: 800, letterSpacing: ".14em", color: "rgba(255,255,255,.9)" });
  E.big = el("a", "$100,000");
  S(E.big, { fontFamily: "'Inter Display', Inter, sans-serif", fontSize: "200px", lineHeight: "200px", fontWeight: 900, letterSpacing: "-.02em" });
  E.same = maskEl("", "Same target for every row", 34);
  S(E.same.i, { fontSize: "26px", lineHeight: "34px", fontWeight: 600, color: "var(--ink2)" });
  E.title = maskEl("", "TIME TO REACH $100,000", 42);
  S(E.title.i, { fontSize: "32px", lineHeight: "42px", fontWeight: 800, letterSpacing: ".06em" });

  // ---- assumption cards (become the footnote + disclaimer) ----
  E.as = [
    { lbl: "STARTING BALANCE", val: "$0", sub: "deposits at each month’s end" },
    { lbl: "ASSUMED RETURN", val: `8%<span style="font-size:34px;font-weight:800;color:var(--ink2)"> / YEAR</span>`, sub: "compounded monthly" },
  ].map((a, k) => {
    const o = { bg: el("a card") };
    o.bg.style.boxShadow = "0 12px 34px rgba(19,23,30,.09)";
    o.lbl = el("a lbl", a.lbl, o.bg); pos(o.lbl, 30, 30);
    o.val = el("a", a.val, o.bg); S(o.val, { fontSize: "104px", lineHeight: "116px", fontWeight: 900, letterSpacing: "-.02em",
      color: k ? "var(--green)" : "var(--ink)" }); pos(o.val, 26, 62);
    o.sub = el("a", a.sub, o.bg); S(o.sub, { fontSize: "24px", lineHeight: "30px", fontWeight: 600, color: "var(--ink2)" }); pos(o.sub, 30, 186);
    return o;
  });

  // ---- chart rows ----
  ROWS.forEach((r, i) => {
    r.yrs = r.months / 12;
    r.layer = el("a");
    r.bg = el("a card", "", r.layer); r.accent = el("accent", "", r.bg);
    r.hl = el("a", "", r.layer); S(r.hl, { height: "66px", borderRadius: "14px", background: "var(--gsoft)" });
    r.track = el("a track", "", r.layer); r.track.style.width = TRACK_W + "px";
    r.g10 = el("a grid", "", r.layer); r.g20 = el("a grid", "", r.layer);
    r.shade = el("a shade", "", r.layer); r.ref = el("a ref", "", r.layer);
    r.barEl = el("a bar", "", r.layer); r.dot = el("a dot", CHECK, r.layer);
    r.amtG = el("a", "", r.layer);
    r.amtM = el("a mask", "", r.amtG); r.amtM.style.height = "76px";
    r.amtV = el("in amt", r.amt, r.amtM);
    r.unit = el("a unit", "/ MONTH", r.amtG);
    r.wAmt = tw(r.amt, "amt");
    r.dur = makeDur(r.layer, r.dur, 68, 28);
  });

  // ---- axis ----
  E.ticks = [0, 10, 20, 30].map(v => { const m = maskEl("tick", v, 36); m.w = tw(String(v), "tick"); return m; });
  E.tmarks = [0, 10, 20, 30].map(() => { const d = el("a"); S(d, { width: "2px", height: "10px", background: "rgba(19,23,30,.3)" }); return d; });
  E.axis = el("a"); S(E.axis, { height: "2px", width: TRACK_W + "px", background: "rgba(19,23,30,.18)" });
  E.years = maskEl("", "Years", 34);
  S(E.years.i, { fontSize: "26px", lineHeight: "34px", fontWeight: 600, color: "var(--muted)", letterSpacing: ".04em" });
  E.yearsW = tw("Years", "unit");

  // ---- footnote + disclaimer ----
  const FOOT = "$0 start • 8% a year, compounded monthly • Before taxes & fees";
  E.foot = maskEl("foot", FOOT, 34); E.wFoot = tw(FOOT, "foot");
  E.disc = el("a", "Illustration only — returns aren’t guaranteed.");
  S(E.disc, { fontSize: "31px", lineHeight: "40px", fontWeight: 800, textAlign: "center", borderRadius: "14px",
    padding: "8px 26px", border: "2px solid transparent" });
  E.wDisc = E.disc.getBoundingClientRect().width;

  // ---- captions (verbatim narration, ≤2 lines) ----
  E.caps = [
    [0.00, 1.97, `Your first ${G("$100K")} could take about`],
    [1.97, 3.42, `${G("26 years")}…`],
    [3.55, 5.10, `or about ${G("6½")}.`],
    [5.45, 6.47, `Starting from ${G("zero")},`],
    [6.50, 8.62, `assuming ${G("8%")} annual growth:`],
    [8.87, 10.66, `Invest ${G("$100")} a month —`],
    [10.78, 12.30, `about ${G("26 years")}.`],
    [12.39, 13.48, `${G("$250")} —`],
    [13.57, 14.99, `about ${G("16 years")}.`],
    [15.09, 16.06, `${G("$500")} —`],
    [16.11, 17.56, `about ${G("11 years")}.`],
    [17.65, 18.56, `${G("$1,000")} —`],
    [18.62, 20.45, `about ${G("6½ years")}.`],
    [20.57, 22.06, "Returns aren’t guaranteed,"],
    [22.11, 24.86, `but your ${G("monthly contribution")}<br>makes a big difference.`],
  ].map(([t0, t1, html]) => {
    const m = maskEl("cap", `<span class="pill">${html}</span>`, 160); m.i.className = "in cap"; m.t0 = t0; m.t1 = t1; return m;
  });

  // ---- ending question ----
  const ecss = "font-size:56px;line-height:66px;font-weight:800;letter-spacing:-.01em";
  const qcss = "font-size:80px;line-height:92px;font-weight:900;letter-spacing:-.02em";
  E.q = [
    ["You don’t need $1,000", ecss, 410, 25.00], ["a month to start.", ecss, 476, 25.12],
    ["Which amount", qcss, 572, 25.40], [`fits your ${G("budget?")}`, qcss, 664, 25.55],
  ].map(([html, css, y, t0]) => {
    const q = maskEl("", html, css.includes("80px") ? 94 : 68); q.i.style.cssText += ";" + css;
    q.w = tw(html, "", css); q.y = y; q.t0 = t0; return q;
  });

  E.wBig = E.big.getBoundingClientRect().width;
  E.wGoal = tw("GOAL", "lbl");
  E.wSame = tw("Same target for every row", "unit");
  E.wYf = E.yf.getBoundingClientRect().width; E.wCt = E.ct.getBoundingClientRect().width;
  E.wOr = E.or.getBoundingClientRect().width;
  ROWS.forEach(r => { r.wUnit = tw("/ MONTH", "unit"); });
}

// ---------- per-frame render ----------
function renderOld(t) {
  const W = 1080;
  pos(E.wm, (W - E.wm.getBoundingClientRect().width) / 2, 200);

  // ================= HOOK (0 – 5.6 s) =================
  // both results are on screen by 0.8 s; each column then lights up on its spoken number
  const pf = eio(P(t, 5.28, 6.0));          // $100,000 → goal badge
  const hx = eo(P(t, 5.25, 5.6));          // hook exit
  pos(E.yf, (W - E.wYf) / 2, 250 - hx * 40, 1, 1 - hx);
  pos(E.ct, (W - E.wCt) / 2, 524 - hx * 40, 1, 1 - hx);
  E.hookC.style.transform = `scale(${1 + .04 * eio(P(t, 1.0, 5.25))})`;
  pos(E.base, CX, HB, 1, 1 - hx);
  E.hook.forEach(o => {
    const k = o.k;
    const pg = eio(P(t, k ? .25 : .05, .75)) * (1 - eio(hx));           // tower growth, collapses on exit
    const h = PXV * o.r.yrs * pg, top = HB - h;
    S(o.tower, { height: h + "px" });
    const focus = k ? kf(t, [[1.85, 1], [2.05, .45], [3.95, .45], [4.15, 1]]) : kf(t, [[4.05, 1], [4.3, .5]]);
    pos(o.tower, o.x - TOWER_W / 2, top, 1, focus * (1 - hx));
    const ni = eo(P(t, k ? .55 : .4, k ? .85 : .7));                  // number arrives with its tower
    const td = k ? 4.15 : 1.97, punch = 1 + .08 * bump(t, td, td + .5);
    const gh = 168 + 48, gy = HB - PXV * o.r.yrs - 18 - gh + (1 - ni) * 30 + hx * 40;
    o.num.style.transformOrigin = `${o.wNum / 2}px 120px`;
    pos(o.num, o.x - o.wNum / 2, gy, punch, ni * focus * (1 - hx));
    pos(o.yrs, o.x - o.wYrs / 2, gy + 168, 1, ni * focus * (1 - hx));
    pos(o.lab, o.x - o.wLab / 2, HB + 16 + hx * 30, 1, 1 - hx);
  });
  pos(E.or, (W - E.wOr) / 2, 880, 1, eo(P(t, .6, .9)) * (1 - hx));

  // badge + flying $100,000
  const BX = 72, BY = 252, BH = 76;
  const amtS = 46 / 200, wAmtB = E.wBig * amtS;
  const ax = BX + 66 + E.wGoal + 12, ay = BY + (BH - 46) / 2;
  const bw = ax - BX + wAmtB + 26;
  const pb = P(pf, 0.55, 1);
  const pulse = 1 + 0.05 * bump(t, 20.25, 20.85);
  S(E.badge, { width: bw + "px", transformOrigin: `${bw / 2}px 38px` });
  E.badge.style.transform = `translate(${BX}px,${BY}px) scale(${L(.6, 1, eo(pb)) * pulse})`;
  E.badge.style.opacity = eo(pb);
  const bcx = BX + bw / 2, bcy = BY + 38, pz = (x, y) => [bcx + (x - bcx) * pulse, bcy + (y - bcy) * pulse];
  pos(E.bdot, ...pz(BX + 22, BY + 23), pulse, P(pf, .8, 1));
  pos(E.goal, ...pz(BX + 66, ay + BL(46, 46) - BL(22, 26)), pulse, P(pf, .8, 1));
  const [bx, by] = pz(L((W - E.wBig) / 2, ax, pf), L(318, ay, pf));
  pos(E.big, bx, by, L(1, amtS, pf) * pulse);
  E.big.style.color = mix("#13865B", "#FFFFFF", P(pf, .55, .9));
  const fadeEnd = 1 - eo(P(t, 24.5, 24.85));      // chart furniture leaves for the choices
  const pEnd = eio(P(t, 24.85, 25.45));
  E.same.m.style.width = E.wSame + 40 + "px";
  pos(E.same.m, BX + bw + 22, BY + 21, 1, fadeEnd); rise(E.same.i, eo(P(t, 6.0, 6.35)));
  E.title.m.style.width = "700px";
  pos(E.title.m, CX, 352, 1, fadeEnd); rise(E.title.i, eo(P(t, 5.7, 6.1)));

  // ================= ASSUMPTIONS (5.6 – 9.0 s) =================
  const ay2 = rowY(3) + ROW_H;                // chart bottom
  const fy0 = ay2 + 108, dy0 = fy0 + 46;      // footnote line, disclaimer box (move below the choices at the end)
  const fy = L(fy0, 1290, pEnd), dy = L(dy0, 1336, pEnd);
  E.as.forEach((o, k) => {
    const tin = k ? 6.55 : 5.60;
    const pin = eo(P(t, tin, tin + .4)), pout = eio(P(t, 8.45 + k * .06, 8.95 + k * .06));
    S(o.bg, { width: "418px", height: "236px" });
    const x0 = k ? 590 : 72, y0 = 560;
    const tx = (W - E.wFoot) / 2 + k * 300, ty = fy - 8;
    pos(o.bg, L(x0, tx, pout), L(y0 + (1 - pin) * 60, ty, pout), L(1, .35, pout), pin * (1 - eo(P(pout, .3, .9))));
  });
  E.foot.m.style.width = E.wFoot + 4 + "px";
  pos(E.foot.m, (W - E.wFoot) / 2, fy); rise(E.foot.i, eo(P(t, 8.7, 9.05)));
  // disclaimer: neutral while the chart builds, amber from the spoken qualification on
  const dIn = eo(P(t, 8.8, 9.15)), dAmb = eo(P(t, 20.57, 20.9));
  S(E.disc, { color: mix("#4A5260", "#5A4310", dAmb), background: `rgba(244,232,200,${dAmb})`,
    borderColor: `rgba(201,164,74,${dAmb})` });
  pos(E.disc, (W - E.wDisc) / 2, dy + (1 - dIn) * 20, 1 + .05 * bump(t, 20.57, 21.2), dIn);
  E.disc.style.transformOrigin = `${E.wDisc / 2}px 28px`;

  // ================= CHART =================
  const refX = X0 + PX * ROWS[0].yrs;          // the $100 row's finish line
  const emph = eio(P(t, 22.25, 22.65)) * (1 - eio(P(t, 24.35, 24.6)));
  ROWS.forEach((r, i) => {
    // activeness: newest row leads; final comparison = all rows; ending walks through the choices
    const k = [[r.tIn - .15, 1]];
    if (i < 3) k.push([ROWS[i + 1].tIn - .15, 1], [ROWS[i + 1].tIn + .2, 0]);
    k.push([20.1, i === 3 ? 1 : 0], [20.45, .85]);
    const a = kf(t, k);

    const R = { x: CX, y: rowY(i), w: CW, h: ROW_H }, C = chip(i);
    // ending: p1 = the row narrows to an amount-only card in place, p2 = it moves into the 2×2 grid
    const p1 = eio(P(t, 24.55, 24.9)), p2 = eio(P(t, 24.85 + .05 * i, 25.4 + .05 * i)), pe = p2;
    let rect = { ...R, w: L(R.w, CHIP_W, p1) };
    rect = { x: L(rect.x, C.x, pe), y: L(rect.y, C.y, pe), w: L(rect.w, C.w, pe), h: L(rect.h, C.h, pe) };
    const rowOut = 1 - eo(p1);
    const show = eo(P(t, r.tIn - .12, r.tIn + .25)), sx = (1 - show) * -36;
    const pick = eo(P(t, 25.75 + .3 * i, 26.05 + .3 * i));             // choices light up one by one, then stay
    S(r.bg, { width: rect.w + "px", height: rect.h + "px", background: mixH(mixH("#F8F7F2", "#FFFFFF", a), "#FFFFFF", pe),
      border: `${L(2, 3, pe)}px solid ${mixH(mixH("#E6E2D7", "#FFFFFF", a), mixH("#E3DFD4", "#13865B", pick), pe)}`,
      boxShadow: `0 10px 30px rgba(19,23,30,${(.09 * Math.max(a, pe)).toFixed(3)})` });
    pos(r.bg, rect.x + sx, rect.y - 6 * pick, 1, show);
    r.accent.style.opacity = a * rowOut;

    // contribution
    const pa = eo(P(t, r.tIn - .02, r.tIn + .33));
    r.amtM.style.width = r.wAmt + 2 + "px"; rise(r.amtV, pa);
    if (pe > 0) pos(r.unit, (r.wAmt - r.wUnit) / 2, 74, 1, eo(P(pe, .8, 1)));
    else pos(r.unit, r.wAmt + 12, BL(60, 76) - BL(26, 32), 1, pa * rowOut);
    r.amtV.style.color = mix(mixH(mixH("#5E6570", "#13171E", a), "#0A6343", emph), "#13171E", Math.max(p1, pe));
    r.unit.style.color = mix(mixH("#8A919C", "#4A5260", a), "#4A5260", pe);
    let gx = R.x + PAD + sx, gy = R.y + 8, gs = 1;
    if (p1 > 0) {
      const cs = 76 / 60, mx1 = (CHIP_W - r.wAmt) / 2, mx2 = (CHIP_W - r.wAmt * cs) / 2;
      gx = rect.x + L(L(PAD, mx1, p1), mx2, pe); gy = rect.y + L(L(8, (ROW_H - 76) / 2, p1), 24, pe); gs = L(1, cs, pe);
    }
    pos(r.amtG, gx, gy, gs, show);
    const hp = eo(P(t, 22.25 + .12 * i, 22.65 + .12 * i)) * (1 - eio(P(t, 24.55, 24.85)));
    S(r.hl, { width: (r.wAmt + 28) + "px", opacity: hp,
      transform: `translate(${R.x + PAD - 14}px,${R.y + 13}px) scaleX(${L(.4, 1, hp)})` });

    // duration: "?" while the bar runs, then the result with a short punch-in (subtle zoom on the number)
    const pd = eo(P(t, r.tDur, r.tDur + .32));
    const dcol = mix(mixH("#5E6570", "#0A6343", a), "#0A6343", Math.max(emph, pe));
    const wD = layDur(r.dur, pd, dcol, mix(mixH("#8A919C", "#0A6343", a * .8), "#0A6343", Math.max(emph, pe)));
    if (pe > 0) {   // the result rides along inside its choice card
      r.dur.g.style.transformOrigin = "0 0";
      pos(r.dur.g, C.x + (CHIP_W - wD * .72) / 2, C.y + 162, .72, eo(P(pe, .8, 1)));
    } else {
      const sc = 1 + .14 * (1 - eo(P(t, r.tDur, r.tDur + .6))) * (t >= r.tDur ? 1 : 0);
      r.dur.g.style.transformOrigin = `${wD}px 42px`;
      pos(r.dur.g, R.x + PAD + TRACK_W - wD + sx, R.y + 4, sc, eo(P(t, r.tIn + .05, r.tIn + .35)) * rowOut);
    }

    // track, gridlines, bar, dot
    const by = R.y + BAR_Y;
    pos(r.track, X0 + sx, by, 1, show * rowOut);
    pos(r.g10, X0 + PX * 10 - 1 + sx, by - 8, 1, show * rowOut);
    pos(r.g20, X0 + PX * 20 - 1 + sx, by - 8, 1, show * rowOut);
    const pbar = eio(P(t, r.bar[0], r.bar[1]));
    r.barEl.style.width = PX * r.yrs * pbar + "px";
    r.barEl.style.background = mixH("#A9D3BC", "#13865B", Math.max(a, emph * .5));
    pos(r.barEl, X0, by, 1, (pbar > 0 ? 1 : 0) * rowOut);
    const dotP = eo(P(t, r.bar[1] - .08, r.bar[1] + .22));
    const dpulse = 1 + .22 * bump(t, 20.25 + .08 * i, 20.75 + .08 * i);
    S(r.dot, { opacity: dotP * rowOut, transformOrigin: "15px 15px", background: mixH("#5FAE88", "#0A6343", Math.max(a, .5)),
      transform: `translate(${X0 + PX * r.yrs - 15}px,${by - 3}px) scale(${L(.5, 1, dotP) * dpulse})` });

    // time saved vs the $100 row: dashed finish line + shaded gap, drawn right after each result
    if (i > 0) {
      const rp = eo(P(t, r.tDur + .15, r.tDur + .45));
      S(r.ref, { opacity: rp * rowOut, transform: `translate(${refX - 1.5}px,${by - 10}px) scaleY(${rp})` });
      const sp = eo(P(t, r.tDur + .3, r.tDur + .85));
      const endX = X0 + PX * r.yrs;
      r.shade.style.width = (refX - endX) * sp + "px";
      pos(r.shade, endX, by, 1, (sp > 0 ? 1 : 0) * rowOut);
    } else { r.shade.style.opacity = 0; r.ref.style.opacity = 0; }
  });

  // axis
  pos(E.axis, X0, ay2 + 8, 1, eo(P(t, 5.75, 6.15)) * fadeEnd);
  E.axis.style.transform = `translate(${X0}px,${ay2 + 8}px) scaleX(${eio(P(t, 5.75, 6.25))})`;
  E.ticks.forEach((m, k) => {
    const x = X0 + PX * 10 * k;
    m.m.style.width = m.w + 4 + "px";
    pos(m.m, x - m.w / 2 - 2, ay2 + 20, 1, fadeEnd); rise(m.i, eo(P(t, 5.85 + .1 * k, 6.2 + .1 * k)));
    pos(E.tmarks[k], x - 1, ay2 + 4, 1, eo(P(t, 5.85 + .1 * k, 6.15 + .1 * k)) * fadeEnd);
  });
  E.years.m.style.width = E.yearsW + 10 + "px";
  pos(E.years.m, X0 + TRACK_W / 2 - E.yearsW / 2, ay2 + 56, 1, fadeEnd); rise(E.years.i, eo(P(t, 6.15, 6.5)));

  // ================= CAPTIONS + QUESTION =================
  const capY = 1330;
  E.caps.forEach(c => {
    const pin = c.t0 === 0 ? 1 : eo(P(t, c.t0, c.t0 + .22));
    const out = P(t, c.t1 - .1, c.t1);
    c.m.style.width = "936px";
    pos(c.m, CX, capY, 1, (t >= c.t0 && t < c.t1 ? 1 : 0) * (1 - out));
    rise(c.i, pin);
  });
  E.q.forEach(q => {
    q.m.style.width = q.w + 8 + "px";
    pos(q.m, (W - q.w) / 2, q.y); rise(q.i, eo(P(t, q.t0, q.t0 + .38)));
  });
}

window.ready = (async () => {
  await document.fonts.load("800 56px Inter"); await document.fonts.load("900 200px 'Inter Display'");
  await document.fonts.ready;
  build(); renderAt(0); return true;
})();
const renderAt = tn => renderOld(toOld(tn));
window.renderAt = renderAt;
window.DURATION = DURATION;
// preview: open with ?t=12.6 for a still, or ?play for realtime playback
const qs = new URLSearchParams(location.search);
window.ready.then(() => {
  if (qs.has("t")) renderAt(parseFloat(qs.get("t")));   // video seconds
  if (qs.has("play")) { const t0 = performance.now(); const f = () => { const t = (performance.now() - t0) / 1000; renderAt(t % DURATION); requestAnimationFrame(f); }; f(); }
});
</script>
</body>
